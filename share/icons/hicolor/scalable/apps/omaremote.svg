<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24">
  <!-- A monitor showing the Omarchy spiral: a remote Omarchy desktop. The spiral is Flea's mark
       (the Omarchy spiral recut on the 24 grid), so the two read as a family. A static file cannot
       read the live palette, so it takes Tokyo Night's, as Flea's icon does. -->
  <rect width="24" height="24" fill="#1a1b26"/>
  <rect x="1.5" y="2.5" width="21" height="15" rx="1.6" fill="#7aa2f7"/>
  <rect x="3" y="4" width="18" height="12" rx="0.4" fill="#1a1b26"/>
  <path transform="translate(6.6 4.6) scale(0.45)" d="M21 21H3V3h18v14H7V7h10v6h-6" fill="none" stroke="#9ece6a" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="10.25" y="17.5" width="3.5" height="2.5" fill="#7aa2f7"/>
  <rect x="7" y="19.8" width="10" height="1.9" rx="0.7" fill="#7aa2f7"/>
</svg>
