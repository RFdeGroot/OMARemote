# Builds the Arch package for x86_64 and aarch64 in clean containers and attaches both, with the
# PKGBUILD, to the GitHub release of the tag. A clean build keeps the package's metadata free of
# whatever the maintainer's machine has installed; packaging/arch/ci-build.sh does the build.
#
# Releasing: set _tag/pkgver in packaging/arch/PKGBUILD, commit, tag (v0.2.0, v0.3.0-beta, …), push the tag.
# A tag with a suffix (-alpha, -beta, -rc) becomes a GitHub pre-release.
# For a tag pushed before this workflow existed: Actions → Release → Run workflow, with the tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release (its PKGBUILD _tag must match)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  package:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: archlinux:base-devel
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: archlinuxarm:local
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the PKGBUILD is for this tag
        run: |
          grep -qx "_tag=$TAG" packaging/arch/PKGBUILD || {
            echo "packaging/arch/PKGBUILD does not build $TAG (set _tag and pkgver)"; exit 1; }

      # Arch Linux ARM publishes no container image; its root filesystem becomes one. It is only
      # used after its signature checks out against Arch Linux ARM's build key, kept in this repo
      # (packaging/arch/archlinuxarm-build.gpg, cross-checked against the keyserver and Arch Linux
      # ARM's keyring repository): the transport is not trusted, the key is. HTTPS on top, from a
      # mirror with a valid certificate (os.archlinuxarm.org itself has none).
      - name: Arch Linux ARM image
        if: matrix.arch == 'aarch64'
        env:
          ROOTFS: https://fl.us.mirror.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          BUILD_KEY: 68B3537F39A313B3E574D06777193F152BDBE6A6
        run: |
          curl -fsSL --proto '=https' -o rootfs.tar.gz "$ROOTFS"
          curl -fsSL --proto '=https' -o rootfs.tar.gz.sig "$ROOTFS.sig"
          gpgv --status-fd 1 --keyring "$PWD/packaging/arch/archlinuxarm-build.gpg" rootfs.tar.gz.sig rootfs.tar.gz \
            | tee gpgv.status
          grep -q "^\[GNUPG:\] VALIDSIG $BUILD_KEY " gpgv.status || {
            echo "Arch Linux ARM root filesystem: no valid signature by $BUILD_KEY"; exit 1; }
          docker import rootfs.tar.gz archlinuxarm:local
          rm rootfs.tar.gz rootfs.tar.gz.sig gpgv.status

      - name: Build the package
        run: |
          docker run --rm -v "$PWD:/src" \
            -e PACKAGER="OMARemote release workflow <$GITHUB_SERVER_URL/$GITHUB_REPOSITORY>" \
            ${{ matrix.image }} bash /src/packaging/arch/ci-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: out/*.pkg.tar.zst
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: out

      - name: Attach to the release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=; [[ $TAG == *-* ]] && prerelease=--prerelease
            pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
            pkgrel=$(sed -n 's/^pkgrel=//p' packaging/arch/PKGBUILD)
            pkg="omaremote-$pkgver-$pkgrel-\$(uname -m).pkg.tar.zst"
            cat > notes.md <<EOF
          OMARemote is in early development: it works day to day, but expect rough edges. Please report what you run into: $GITHUB_SERVER_URL/$GH_REPO/issues

          Install on Omarchy, on Intel/AMD (x86_64) or Apple Silicon (aarch64); pacman pulls in every dependency:

          \`\`\`bash
          curl -LO $GITHUB_SERVER_URL/$GH_REPO/releases/download/$TAG/$pkg
          sudo pacman -U ./$pkg
          \`\`\`

          The package is not signed: pacman installs it from a downloaded file, not straight from the URL.

          Updating from an earlier release works the same way: pacman upgrades in place. Restart OMARemote afterwards.

          Or build it from source with the attached \`PKGBUILD\`: \`makepkg -si\`. See the README for more.
          EOF
            gh release create "$TAG" $prerelease --verify-tag --title "OMARemote ${TAG#v}" --notes-file notes.md
          fi
          gh release upload "$TAG" out/*.pkg.tar.zst packaging/arch/PKGBUILD --clobber
